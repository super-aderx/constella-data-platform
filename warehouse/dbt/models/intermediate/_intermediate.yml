      - input: ref('int_orders')
        rows:
          - {tenant_id: "00000000-0000-0000-0000-00000000000a", order_id: "00000000-0000-0000-0000-000000000001", customer_id: "00000000-0000-0000-0000-0000000000a1", order_day: "2026-09-20", status: paid, total_cents: 8000}
