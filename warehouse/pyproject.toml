[project]
name = "constella-warehouse"
version = "0.1.0"
description = "Constella warehouse: the dev event generator and the dbt project"
requires-python = ">=3.14"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-postgres>=1.11,<1.12",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "networkx>=3.5",
    "pytest>=9.1",
    "ruff>=0.16,<0.17",
    "sqlfluff>=4.3,<4.4",
    "sqlfluff-templater-dbt>=4.3,<4.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
